server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: any non-file path serves index.html to let React Router work.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Optional API proxy — used only if this container is ever exposed directly.
    # In the standard ReplyPilot-style topology the HOST nginx (the TLS edge)
    # proxies /api to the backend:8001 itself, so this block is a harmless
    # duplicate that never matches there.
    location /api {
        proxy_pass http://backend:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/javascript application/xml image/svg+xml font/woff2;
}
